{% extends "base.html" %}

{% block titulo %}{{ titulo }}{% endblock %}

{% block contenido %}
<div class="auth-container">
    <div class="auth-card">
        <h1>Crear Cuenta</h1>
        <p class="auth-subtitle">Regístrate en ParkSmart</p>

        {% if error %}
        <div class="alert alert-error">
            {{ error }}
        </div>
        {% endif %}

        <form method="POST" action="/registro" class="auth-form">
            <div class="form-group">
                <label for="nombre">Nombre completo</label>
                <input
                    type="text"
                    id="nombre"
                    name="nombre"
                    placeholder="Tu nombre completo"
                    required
                    minlength="2"
                    maxlength="100"
                    autocomplete="name"
                >
            </div>

            <div class="form-group">
                <label for="correo">Correo electrónico</label>
                <input
                    type="email"
                    id="correo"
                    name="correo"
                    placeholder="tu@correo.com"
                    required
                    autocomplete="email"
                >
            </div>

            <div class="form-group">
                <label for="telefono">Número de teléfono</label>
                <input
                    type="tel"
                    id="telefono"
                    name="telefono"
                    placeholder="300 123 4567"
                    maxlength="20"
                    pattern="\+?[0-9 \-]{7,20}"
                    title="Solo números, espacios, guiones y un + inicial (7 a 20 caracteres)"
                    required
                    autocomplete="tel"
                >
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Mínimo 6 caracteres"
                    required
                    minlength="6"
                    autocomplete="new-password"
                >
            </div>

            <div class="form-group">
                <label for="confirmar_password">Confirmar contraseña</label>
                <input
                    type="password"
                    id="confirmar_password"
                    name="confirmar_password"
                    placeholder="Repite tu contraseña"
                    required
                    minlength="6"
                    autocomplete="new-password"
                >
            </div>

            <p class="registro-nota">
                <!-- ¿Tienes un parqueadero? Las cuentas de propietario las crea el administrador de ParkSmart:
                contáctalo para registrar tu negocio. -->
            </p>

            <button type="submit" class="btn btn-primary btn-block">
                Crear Cuenta
            </button>
        </form>

        <p class="auth-footer">
            ¿Ya tienes cuenta? <a href="/login">Inicia sesión aquí</a>
        </p>
    </div>
</div>
{% endblock %}

{% block extra_css %}
<style>
    .registro-nota { font-size: 0.85rem; color: var(--color-text-light); margin: 0.5rem 0 1rem; }

    .auth-container {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 60vh;
        padding: 2rem 1rem;
    }

    .auth-card {
        background: white;
        padding: 2.5rem;
        border-radius: 1rem;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        width: 100%;
        max-width: 400px;
    }

    .auth-card h1 {
        text-align: center;
        margin-bottom: 0.5rem;
        color: var(--color-text);
    }

    .auth-subtitle {
        text-align: center;
        color: var(--color-text-light);
        margin-bottom: 1.5rem;
    }

    .auth-form {
        display: flex;
        flex-direction: column;
        gap: 1rem;
    }

    .form-group {
        display: flex;
        flex-direction: column;
        gap: 0.25rem;
    }

    .form-group label {
        font-weight: 600;
        font-size: 0.875rem;
        color: var(--color-text);
    }

    .form-group input,
    .form-group select {
        padding: 0.75rem;
        border: 1px solid var(--color-border);
        border-radius: var(--radius-md);
        font-size: 1rem;
        transition: var(--transition);
    }

    .form-group input:focus {
        outline: none;
        border-color: var(--color-primary);
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }

    .btn-block {
        width: 100%;
        margin-top: 0.5rem;
    }

    .auth-footer {
        text-align: center;
        margin-top: 1.5rem;
        color: var(--color-text-light);
        font-size: 0.875rem;
    }

    .auth-footer a {
        color: var(--color-primary);
        text-decoration: none;
        font-weight: 600;
    }

    .auth-footer a:hover {
        text-decoration: underline;
    }

    .alert {
        padding: 0.75rem 1rem;
        border-radius: var(--radius-md);
        margin-bottom: 1rem;
        font-size: 0.875rem;
    }

    .alert-error {
        background-color: #fef2f2;
        color: var(--color-danger);
        border: 1px solid #fecaca;
    }
</style>
{% endblock %}
